<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus</title>
<style>
  /* Shaped window: nothing outside the lens is painted, so the desktop shows
     through. The whole surface is a drag region except the buttons. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #stage { position: relative; width: 150px; height: 182px; }
  canvas { display: block; width: 150px; height: 150px; }
  /* Idle sessions dim the whole lens; hovering brings it back to full. */
  #stage { opacity: 1; transition: opacity .25s ease; }
  #stage.idle { opacity: .58; }
  #stage.idle:hover { opacity: 1; }

  .chrome { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity .18s ease; }
  #stage:hover .chrome { opacity: 1; }
  .chrome span {
    width: 15px; height: 15px; border-radius: 50%; font-size: 8px; line-height: 14px;
    text-align: center; color: rgba(255,255,255,.75); cursor: pointer;
    background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.22);
  }
  .chrome span:hover { color: #39ff14; border-color: rgba(57,255,20,.65); }
  .chrome span.off { color: rgba(255,255,255,.28); }

  /* Bottom bar: duration pills sit beside the transport while the session is
     idle, and get out of the way entirely once it is running. */
  #bar { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; gap: 5px; justify-content: center; align-items: center; }
  #pills { display: flex; gap: 4px; }
  #bar.running #pills { display: none; }
  #pills b {
    font-weight: 400; font-size: 8.5px; padding: 2.5px 7px; border-radius: 999px; cursor: pointer;
    background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.7);
  }
  #pills b:hover { color: #fff; }
  #pills b.on { background: #39ff14; border-color: #39ff14; color: #06090c; }
  #go {
    width: 21px; height: 21px; border-radius: 50%; cursor: pointer; flex: none;
    font-size: 9px; line-height: 19px; text-align: center; letter-spacing: -1px;
    background: rgba(57,255,20,.14); border: 1px solid #39ff14; color: #39ff14;
    box-shadow: 0 0 8px rgba(57,255,20,.22);
  }
  #go:hover { background: #39ff14; color: #06090c; }
</style>
</head>
<body>
<div id="stage" data-tauri-drag-region>
  <canvas id="lens" width="150" height="150" data-tauri-drag-region></canvas>
  <div class="chrome">
    <span id="mute" title="Mute">♪</span>
    <span id="close" title="Close">✕</span>
  </div>
  <div id="bar">
    <span id="pills"><b data-d="30">30</b><b data-d="45">45</b><b data-d="90">90</b></span>
    <span id="go" title="Start">▶</span>
  </div>
</div>

<script>
(function () {
  var TAU = Math.PI * 2, NEON = '57,255,20';
  var W = 150, CX = 75, CY = 75;
  var RE = 36, RH = 23.5, FADE = 56, EDGE = 68;   // Einstein ring, mass, edge fade

  var cv = document.getElementById('lens');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = W * dpr;
  var c = cv.getContext('2d'); c.scale(dpr, dpr);

  /* ── timer state, mirrored from the main window ───────────────────────── */
  var st = { running: false, endTarget: 0, totalSecs: 30 * 60, remainSecs: 30 * 60, dur: 30, title: '' };

  function remain() {
    if (!st.running) return st.remainSecs;
    return Math.max(0, Math.round((st.endTarget - Date.now()) / 1000));
  }
  function progress() {
    return st.totalSecs > 0 ? Math.min(1, Math.max(0, 1 - remain() / st.totalSecs)) : 0;
  }
  function fmt(s) {
    var m = Math.floor(s / 60), q = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q;
  }

  /* ── audio: a tick at each twelfth, a three-note chime at the bell ────── */
  var muted = localStorage.getItem('cdx_widget_muted') === '1';
  var ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = false; } }
    return ac || null;
  }
  function tick() {
    if (muted) return; var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 1180; o.type = 'sine';
    g.gain.setValueAtTime(0.035, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.05);
    o.start(); o.stop(a.currentTime + 0.06);
  }
  function chime() {
    if (muted) return; var a = audio(); if (!a) return;
    [528, 660, 792].forEach(function (f, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value = f; g.gain.value = 0.16;
      o.start(a.currentTime + i * 0.35);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + i * 0.35 + 0.9);
      o.stop(a.currentTime + i * 0.35 + 0.95);
    });
  }
  function paintMute() { document.getElementById('mute').classList.toggle('off', muted); }
  document.getElementById('mute').addEventListener('click', function () {
    muted = !muted; localStorage.setItem('cdx_widget_muted', muted ? '1' : '0'); paintMute();
  });
  paintMute();

  /* ── bridge to the main window ────────────────────────────────────────── */
  var T = window.__TAURI__;
  function send(a, v) { if (T && T.event) T.event.emit('pomo:cmd', { a: a, v: v }); }
  if (T && T.event) {
    T.event.listen('pomo:state', function (e) {
      var p = e.payload || {};
      st.running = !!p.running; st.endTarget = p.endTarget || 0;
      st.totalSecs = p.totalSecs || st.totalSecs;
      st.remainSecs = typeof p.remainSecs === 'number' ? p.remainSecs : st.remainSecs;
      st.dur = p.dur || st.dur; st.title = p.title || '';
      paintBar(); resetSteps();
    });
    T.event.emit('pomo:req', {});          // ask for current state on open
  }
  document.getElementById('close').addEventListener('click', function () {
    if (T && T.core) T.core.invoke('widget_close').catch(function () {});
  });
  // Transport: the ▶/❚❚ button is the primary control; double-clicking the
  // lens does the same thing for anyone who finds that first.
  document.getElementById('go').addEventListener('click', function () { send('toggle'); });
  cv.addEventListener('dblclick', function () { send('toggle'); });
  document.getElementById('pills').addEventListener('click', function (e) {
    var b = e.target.closest('b'); if (!b) return;
    send('dur', +b.dataset.d);
  });
  function paintBar() {
    [].forEach.call(document.querySelectorAll('#pills b'), function (b) {
      b.classList.toggle('on', +b.dataset.d === st.dur);
    });
    // Once a session is under way the durations are moot — hide them.
    document.getElementById('bar').classList.toggle('running', st.running);
    var go = document.getElementById('go');
    go.textContent = st.running ? '❚❚' : '▶';
    go.title = st.running ? 'Pause' : 'Start';
  }
  paintBar();

  /* ── the lens ─────────────────────────────────────────────────────────── */
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function smooth(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  var lastStep = -1;
  function resetSteps() { lastStep = Math.floor(progress() * 12 + 1e-9); }
  resetSteps();

  function draw(p, t) {
    c.clearRect(0, 0, W, W);
    // Background starfield drifts faster the less time is left.
    var spin = t * 0.04 * (1 + 2.6 * p);

    for (var i = 0; i < 46; i++) {
      var r = 6 + rnd(i) * 56;
      var ba = rnd(i + 7) * TAU + spin * (0.55 + rnd(i + 3) * 0.9);
      var disc = Math.sqrt(r * r + 4 * RE * RE);
      var rp = (r + disc) / 2;                       // lensed image radius
      if (rp > EDGE) continue;
      var mag = Math.min(1, (RE / Math.max(r, 4.5)) * 0.5);
      var stretch = Math.min(0.5, (RE * RE) / (rp * rp) * 1.25);
      var tw = 0.65 + 0.35 * Math.sin(t * 1.8 + i * 2.1);
      var band = smooth(0, 4.5, Math.abs(rp - RE));   // keep the ring legible
      var edge = 1 - smooth(FADE, EDGE, rp);          // never clip at the border
      var al = (0.14 + 0.42 * mag) * tw * (0.35 + 0.65 * band) * edge;
      if (al < 0.02) continue;
      c.beginPath(); c.arc(CX, CY, rp, ba - stretch, ba + stretch);
      c.strokeStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')';
      c.lineWidth = 0.7 + mag * 1.1; c.lineCap = 'round'; c.stroke();
    }

    // Einstein ring — the countdown.
    c.beginPath(); c.arc(CX, CY, RE, 0, TAU);
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 2; c.stroke();
    if (p > 0.001) {
      c.beginPath(); c.arc(CX, CY, RE, -Math.PI / 2, -Math.PI / 2 + p * TAU);
      c.strokeStyle = 'rgba(' + NEON + ',' + (0.6 + 0.35 * p).toFixed(2) + ')';
      c.lineWidth = 2; c.lineCap = 'round';
      c.shadowColor = 'rgba(' + NEON + ',0.85)';
      c.shadowBlur = 7 + (p > 0.999 ? 16 * (0.5 + 0.5 * Math.sin(t * 6)) : 0);
      c.stroke(); c.shadowBlur = 0;
    }
    for (var k = 0; k < 12; k++) {
      var a = k / 12 * TAU - Math.PI / 2, on = p > 1e-6 && k / 12 < p;
      c.beginPath(); c.arc(CX + Math.cos(a) * RE, CY + Math.sin(a) * RE, on ? 1.6 : 0.8, 0, TAU);
      c.fillStyle = on ? 'rgba(' + NEON + ',1)' : 'rgba(255,255,255,0.16)'; c.fill();
    }

    // The mass — and the only surface text sits on.
    c.beginPath(); c.arc(CX, CY, RH, 0, TAU);
    c.fillStyle = 'rgba(2,4,7,0.94)'; c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 1; c.stroke();

    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#fff'; c.font = '600 13px ui-monospace, monospace';
    c.fillText(fmt(remain()), CX, CY - 3);
    c.fillStyle = 'rgba(255,255,255,0.42)'; c.font = '6px ui-monospace, monospace';
    var lbl = (st.title || 'DEEP WORK').toUpperCase();
    if (lbl.length > 13) lbl = lbl.slice(0, 12) + '…';
    c.fillText(lbl, CX, CY + 9);
  }

  var stage = document.getElementById('stage');
  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    var p = progress();

    // A tick as each twelfth of the session falls in; the chime at the bell.
    var step = Math.floor(p * 12 + 1e-9);
    if (st.running && step !== lastStep) {
      if (step >= 12) chime(); else if (step > lastStep) tick();
      lastStep = step;
    }

    stage.classList.toggle('idle', !st.running);
    // Idle costs ~8fps instead of 60 — the widget lives on screen all day.
    acc += dt;
    if (st.running || acc > 0.12) { acc = 0; draw(p, now / 1000); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
