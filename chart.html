<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Observation Log</title>
<style>
  /* Shaped window — only the slab is painted, the desktop shows through the
     rest. Everything is a drag region except the controls and the rows. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden; color: rgba(255,255,255,.86);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #slab {
    width: 264px; height: 100%; box-sizing: border-box;
    background: rgba(6,9,12,.9); border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px; padding: 7px 10px 9px; display: flex; flex-direction: column;
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    transition: opacity .25s ease; opacity: .9;
  }
  #slab:hover { opacity: 1; }

  #top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  #grip { font-size: 7px; letter-spacing: 1.4px; color: rgba(255,255,255,.30); }
  #chrome { display: flex; gap: 7px; }
  #chrome span { font-size: 9px; color: rgba(255,255,255,.35); cursor: pointer; }
  #chrome span:hover { color: #39ff14; }

  /* View toggle — the four catalogues this log can show. */
  #tabs { display: flex; gap: 3px; margin-bottom: 6px; }
  #tabs b {
    flex: 1; font-weight: 400; font-size: 7.5px; letter-spacing: .6px; text-align: center;
    padding: 3px 0; border-radius: 3px; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    color: rgba(255,255,255,.5);
  }
  #tabs b:hover { color: rgba(255,255,255,.85); }
  #tabs b.on { background: rgba(57,255,20,.13); border-color: rgba(57,255,20,.45); color: #39ff14; }

  #hdr { font-size: 7px; letter-spacing: 1.5px; color: rgba(57,255,20,.8); margin-bottom: 5px; }
  #rows { flex: 1; overflow-y: auto; overflow-x: hidden; }
  #rows::-webkit-scrollbar { width: 3px; }
  #rows::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 2px; }

  .ent { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
  .ent:hover .tx { color: #fff; }
  .mag { font-size: 7px; color: rgba(255,255,255,.28); width: 26px; flex: none; letter-spacing: -.2px; }
  .st { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .ent.logged .tx { color: rgba(255,255,255,.3); text-decoration: line-through; }
  .sub { font-size: 7px; color: rgba(255,255,255,.3); flex: none; }
  .empty { color: rgba(255,255,255,.28); font-size: 8px; padding: 10px 0; text-align: center; }

  /* Habit tick box — the one row type you act on directly. */
  .bx { width: 26px; flex: none; display: flex; justify-content: center; }
  .bx i {
    width: 10px; height: 10px; border-radius: 2px; display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.34); font-style: normal; font-size: 7px;
    color: transparent; line-height: 1;
  }
  .bx.on i { background: #39ff14; border-color: #39ff14; color: #06090c; box-shadow: 0 0 5px rgba(57,255,20,.6); }
  .ent:hover .bx i { border-color: #39ff14; }

  /* Orbits expand to the tasks riding on them. */
  .chev { width: 26px; flex: none; font-size: 9px; color: rgba(255,255,255,.4); text-align: center;
    transition: transform .15s ease; display: inline-block; }
  .chev.open { transform: rotate(90deg); }
  .ent.orb .tx { color: rgba(255,255,255,.9); }
  .ent.kid { padding-left: 12px; }
  .ent.kid .tx { font-size: 9px; color: rgba(255,255,255,.72); }
  .empty.kid { text-align: left; padding: 3px 0 3px 45px; font-size: 7.5px; }

  /* Drift nudge — surfaces after a stretch with no focus session running. */
  #nudge {
    margin-top: 6px; padding: 6px 8px 7px; border-radius: 4px; cursor: pointer;
    background: rgba(57,255,20,.07); border: 1px solid rgba(57,255,20,.4);
    animation: driftpulse 2.2s ease-in-out infinite;
  }
  #nudge.hide { display: none; }
  #nlabel { font-size: 6.5px; letter-spacing: 1.5px; color: rgba(57,255,20,.85); margin-bottom: 3px; }
  #ncommit {
    font-size: 10px; font-weight: 700; color: #39ff14; text-shadow: 0 0 7px rgba(57,255,20,.5);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #ntask {
    font-size: 9px; font-weight: 700; color: rgba(255,255,255,.9); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @keyframes driftpulse {
    0%, 100% { box-shadow: 0 0 0 rgba(57,255,20,0); border-color: rgba(57,255,20,.32); }
    50%      { box-shadow: 0 0 12px rgba(57,255,20,.28); border-color: rgba(57,255,20,.85); }
  }
  @media (prefers-reduced-motion: reduce) { #nudge { animation: none; } }

  /* Focus lens, folded into the log as a footer so there is one widget, not two. */
  #lens {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 7px;
    border-top: 1px solid rgba(255,255,255,.09); transition: opacity .25s ease;
  }
  #lens.idle { opacity: .62; }
  #slab:hover #lens.idle { opacity: 1; }
  #lc { flex: none; display: block; width: 46px; height: 46px; }
  #lmid { flex: 1; min-width: 0; }
  #ltime { font-size: 15px; letter-spacing: .5px; color: #fff; line-height: 1.1; }
  #ltask { font-size: 6.5px; letter-spacing: 1.2px; color: rgba(255,255,255,.4);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #go {
    flex: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    font-size: 9px; line-height: 20px; text-align: center; letter-spacing: -1px;
    background: rgba(57,255,20,.14); border: 1px solid #39ff14; color: #39ff14;
    box-shadow: 0 0 8px rgba(57,255,20,.22);
  }
  #go:hover { background: #39ff14; color: #06090c; }
  #pills { display: flex; gap: 4px; justify-content: center; margin-top: 5px; }
  #pills.hide { display: none; }
  #pills b {
    font-weight: 400; font-size: 8px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.13); color: rgba(255,255,255,.6);
  }
  #pills b:hover { color: #fff; }
  #pills b.on { background: #39ff14; border-color: #39ff14; color: #06090c; }
</style>
</head>
<body>
<div id="slab" data-tauri-drag-region>
  <div id="top" data-tauri-drag-region>
    <span id="grip" data-tauri-drag-region>⋮⋮ OBSERVATION LOG</span>
    <span id="chrome"><span id="mute" title="Mute">♪</span><span id="x" title="Close">✕</span></span>
  </div>
  <div id="tabs">
    <b data-v="habits">HABITS</b><b data-v="tasks">TODAY</b><b data-v="overdue">SLIPPED</b><b data-v="commit">ORBITS</b>
  </div>
  <div id="hdr">—</div>
  <div id="rows"></div>
  <div id="nudge" class="hide">
    <div id="nlabel">▲ DRIFTING</div>
    <div id="ncommit">—</div>
    <div id="ntask">—</div>
  </div>
  <div id="lens">
    <canvas id="lc" width="46" height="46"></canvas>
    <div id="lmid">
      <div id="ltime">30:00</div>
      <div id="ltask">DEEP WORK</div>
    </div>
    <span id="go" title="Start">▶</span>
  </div>
  <div id="pills"><b data-d="30">30</b><b data-d="45">45</b><b data-d="90">90</b></div>
</div>

<script>
(function () {
  var T = window.__TAURI__;
  var view = localStorage.getItem('cdx_chart_view') || 'habits';
  var open = {};   // expanded orbits, by commitment id
  var data = { tasks: [], overdue: [], habits: [], commit: [], date: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* Apparent magnitude: brighter (more negative) = more important. Priority
     sets the baseline, overdue brightens, and position dims down the list so
     the column reads like a real catalogue rather than a repeated constant. */
  function mag(item, i) {
    var base = item.pri === 'high' ? -1.4 : item.pri === 'low' ? 3.2 : 0.9;
    if (item.late) base -= 1.2;
    if (item.done) base += 3;
    return base + i * 0.35;
  }
  function starOf(m, done, late) {
    var lum = Math.max(0.14, Math.min(1, 1 - (m + 1.5) / 7));
    if (done) return { c: 'rgba(255,255,255,' + (lum * 0.3).toFixed(2) + ')', glow: '' };
    if (late) return { c: 'rgba(255,183,92,' + lum.toFixed(2) + ')', glow: '0 0 5px rgba(255,183,92,.7)' };
    if (m < -0.6) return { c: '#39ff14', glow: '0 0 6px #39ff14' };
    return { c: 'rgba(255,255,255,' + lum.toFixed(2) + ')', glow: '' };
  }

  function render() {
    [].forEach.call(document.querySelectorAll('#tabs b'), function (b) {
      b.classList.toggle('on', b.dataset.v === view);
    });
    var list = data[view] || [], rows = document.getElementById('rows'), hdr = document.getElementById('hdr');
    var d = (data.date || '').replace(/-/g, ' ');

    if (view === 'habits') {
      var done = list.filter(function (h) { return h.done; }).length;
      hdr.textContent = d + ' · ' + list.length + ' HABITS · ' + done + ' LOGGED';
    } else if (view === 'commit') {
      hdr.textContent = d + ' · ' + list.length + ' ACTIVE ORBITS';
    } else {
      var lg = list.filter(function (t) { return t.done; }).length;
      hdr.textContent = d + ' · ' + list.length + ' OBJECTS · ' + lg + ' LOGGED';
    }

    if (!list.length) {
      // Nothing due today usually means it all slipped — say so rather than
      // leaving the panel looking broken.
      var slipped = (data.overdue || []).length;
      var msg = view === 'overdue' ? 'no slipped orbits ✓'
        : view === 'tasks' ? (slipped ? 'nothing due today · ' + slipped + ' slipped →' : 'nothing due today ✓')
        : 'nothing catalogued';
      rows.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }

    function magCell(m) {
      return '<span class="mag">m ' + (m >= 0 ? ' ' : '−') + Math.abs(m).toFixed(1) + '</span>';
    }
    function star(s) {
      return '<span class="st" style="background:' + s.c + ';box-shadow:' + s.glow + '"></span>';
    }

    rows.innerHTML = list.map(function (it, i) {
      // Habits get a real checkbox — the star alone gave no hint it was clickable.
      if (view === 'habits') {
        var m = it.done ? -1.4 : 1.6 + i * 0.3;
        return '<div class="ent' + (it.done ? ' logged' : '') + '" data-id="' + esc(it.id) + '">' +
          '<span class="bx' + (it.done ? ' on' : '') + '"><i>✓</i></span>' +
          star(it.done ? { c: '#39ff14', glow: '0 0 6px #39ff14' } : starOf(m, false, false)) +
          '<span class="tx">' + esc(it.title) + '</span>' +
          (it.streak ? '<span class="sub">' + esc(it.streak) + 'd</span>' : '') +
          '</div>';
      }

      // Orbits expand in place to the tasks riding on them.
      if (view === 'commit') {
        var mc = -1.4 + (1 - it.pct / 100) * 4;
        var kids = it.tasks || [], isOpen = !!open[it.id];
        var head = '<div class="ent orb" data-orb="' + esc(it.id) + '">' +
          '<span class="chev' + (isOpen ? ' open' : '') + '">›</span>' +
          star(starOf(mc, false, false)) +
          '<span class="tx">' + esc(it.title) + '</span>' +
          '<span class="sub">' + kids.filter(function (k) { return k.done; }).length +
            '/' + kids.length + ' · ' + it.pct + '%</span>' +
          '</div>';
        if (!isOpen) return head;
        var body = kids.length
          ? kids.map(function (k, j) {
              var mk = mag(k, j);
              return '<div class="ent kid' + (k.done ? ' logged' : '') + '" data-id="' + esc(k.id) + '">' +
                magCell(mk) + star(starOf(mk, k.done, k.late)) +
                '<span class="tx">' + esc(k.title) + '</span>' +
                (k.due ? '<span class="sub">' + esc(k.due) + '</span>' : '') +
                '</div>';
            }).join('')
          : '<div class="empty kid">no tasks on this orbit</div>';
        return head + body;
      }

      var mt = mag(it, i);
      return '<div class="ent' + (it.done ? ' logged' : '') + '" data-id="' + esc(it.id) + '">' +
        magCell(mt) + star(starOf(mt, it.done, it.late)) +
        '<span class="tx">' + esc(it.title) + '</span>' +
        (it.due ? '<span class="sub">' + esc(it.due) + '</span>' : '') +
        '</div>';
    }).join('');
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('b'); if (!b) return;
    view = b.dataset.v; localStorage.setItem('cdx_chart_view', view); render();
  });
  document.getElementById('rows').addEventListener('click', function (e) {
    var orb = e.target.closest('.orb');
    if (orb) { open[orb.dataset.orb] = !open[orb.dataset.orb]; render(); return; }
    var r = e.target.closest('.ent'); if (!r || !r.dataset.id || !T || !T.event) return;
    // Habits toggle in place; anything else hands off to the main window.
    T.event.emit('tw:cmd', { a: view === 'habits' ? 'habit' : 'open', id: r.dataset.id, view: view });
  });
  document.getElementById('x').addEventListener('click', function () {
    if (T && T.core) T.core.invoke('chart_close').catch(function () {});
  });

  /* ── Focus lens ─────────────────────────────────────────────────────────
     Same gravitational-lens countdown as before, reduced to a 46px footer so
     the log is the only widget on screen. The main window stays authoritative;
     this mirrors it over the same events. */
  var TAU = Math.PI * 2, NEON = '57,255,20';
  var LW = 46, LX = 23, LY = 23, RE = 15.5, RH = 6.5, LFADE = 19, LEDGE = 22.5;
  var lc = document.getElementById('lc');
  var ldpr = Math.min(window.devicePixelRatio || 1, 2);
  lc.width = LW * ldpr; lc.height = LW * ldpr;
  var lx = lc.getContext('2d'); lx.scale(ldpr, ldpr);

  var st = { running: false, endTarget: 0, totalSecs: 1800, remainSecs: 1800, dur: 30, title: '' };
  function remain() {
    return st.running ? Math.max(0, Math.round((st.endTarget - Date.now()) / 1000)) : st.remainSecs;
  }
  function prog() { return st.totalSecs > 0 ? Math.min(1, Math.max(0, 1 - remain() / st.totalSecs)) : 0; }
  function fmt(s) {
    var m = Math.floor(s / 60), q = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q;
  }

  var muted = localStorage.getItem('cdx_widget_muted') === '1', ac = null;
  /* An AudioContext created without user activation starts suspended, and
     nothing this window plays is ever heard. Resume it on any click in the
     widget, and again before every sound in case the OS suspended it. */
  function audio() {
    if (ac === null) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = false; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac || null;
  }
  document.addEventListener('pointerdown', function () { audio(); }, true);
  function tick() {
    if (muted) return; var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 1180; o.type = 'sine';
    g.gain.setValueAtTime(0.035, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.05);
    o.start(); o.stop(a.currentTime + 0.06);
  }
  function chime() {
    if (muted) return; var a = audio(); if (!a) return;
    [528, 660, 792].forEach(function (f, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value = f; g.gain.value = 0.16;
      o.start(a.currentTime + i * 0.35);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + i * 0.35 + 0.9);
      o.stop(a.currentTime + i * 0.35 + 0.95);
    });
  }
  var mu = document.getElementById('mute');
  function paintMute() { mu.style.color = muted ? 'rgba(255,255,255,.2)' : ''; mu.title = muted ? 'Unmute' : 'Mute'; }
  mu.addEventListener('click', function () {
    muted = !muted; localStorage.setItem('cdx_widget_muted', muted ? '1' : '0'); paintMute();
    if (!muted) tick();   // audible proof the sound works, on the click that unmutes
  });
  paintMute();

  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function smooth(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  function drawLens(p, t) {
    lx.clearRect(0, 0, LW, LW);
    var spin = t * 0.04 * (1 + 2.6 * p);
    for (var i = 0; i < 22; i++) {
      var r = 3 + rnd(i) * 20;
      var ba = rnd(i + 7) * TAU + spin * (0.55 + rnd(i + 3) * 0.9);
      var rp = (r + Math.sqrt(r * r + 4 * RE * RE)) / 2;
      if (rp > LEDGE) continue;
      var mg = Math.min(1, (RE / Math.max(r, 2.2)) * 0.5);
      var stretch = Math.min(0.5, (RE * RE) / (rp * rp) * 1.25);
      var band = smooth(0, 2.2, Math.abs(rp - RE));
      var edge = 1 - smooth(LFADE, LEDGE, rp);
      var al = (0.16 + 0.44 * mg) * (0.65 + 0.35 * Math.sin(t * 1.8 + i * 2.1)) * (0.35 + 0.65 * band) * edge;
      if (al < 0.03) continue;
      lx.beginPath(); lx.arc(LX, LY, rp, ba - stretch, ba + stretch);
      lx.strokeStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')';
      lx.lineWidth = 0.6 + mg * 0.7; lx.lineCap = 'round'; lx.stroke();
    }
    lx.beginPath(); lx.arc(LX, LY, RE, 0, TAU);
    lx.strokeStyle = 'rgba(255,255,255,0.08)'; lx.lineWidth = 1.6; lx.stroke();
    if (p > 0.001) {
      lx.beginPath(); lx.arc(LX, LY, RE, -Math.PI / 2, -Math.PI / 2 + p * TAU);
      lx.strokeStyle = 'rgba(' + NEON + ',' + (0.6 + 0.35 * p).toFixed(2) + ')';
      lx.lineWidth = 1.6; lx.lineCap = 'round';
      lx.shadowColor = 'rgba(' + NEON + ',0.85)';
      lx.shadowBlur = 5 + (p > 0.999 ? 12 * (0.5 + 0.5 * Math.sin(t * 6)) : 0);
      lx.stroke(); lx.shadowBlur = 0;
    }
    lx.beginPath(); lx.arc(LX, LY, RH, 0, TAU);
    lx.fillStyle = 'rgba(2,4,7,0.94)'; lx.fill();
    lx.strokeStyle = 'rgba(255,255,255,0.14)'; lx.lineWidth = 0.8; lx.stroke();
  }

  var go = document.getElementById('go'), pills = document.getElementById('pills');
  go.addEventListener('click', function () { if (T && T.event) T.event.emit('pomo:cmd', { a: 'toggle' }); });
  pills.addEventListener('click', function (e) {
    var b = e.target.closest('b'); if (!b || !T || !T.event) return;
    T.event.emit('pomo:cmd', { a: 'dur', v: +b.dataset.d });
  });
  function paintLens() {
    [].forEach.call(pills.querySelectorAll('b'), function (b) {
      b.classList.toggle('on', +b.dataset.d === st.dur);
    });
    // Durations are moot once a session is under way.
    pills.classList.toggle('hide', st.running);
    document.getElementById('lens').classList.toggle('idle', !st.running);
    go.textContent = st.running ? '❚❚' : '▶';
    go.title = st.running ? 'Pause' : 'Start';
    document.getElementById('ltask').textContent = (st.title || 'DEEP WORK').toUpperCase();
  }

  /* ── Drift nudge ────────────────────────────────────────────────────────
     "Distracted" here means simply: no focus session has been running for a
     while. Nothing watches your screen. After DRIFT_MIN of no session the log
     pulses the commitment closest to its deadline and the one task on it to
     pick up. Starting a session clears it; clicking it opens that task and
     snoozes for half an hour so it can't badger you. */
  var DRIFT_MIN = 20, SNOOZE_MIN = 30;
  var idleSince = Date.now(), snoozeUntil = 0, nudged = false, nudgeTask = null;

  function topCommitment() {
    var live = (data.commit || []).filter(function (c) { return c.pct < 100; });
    if (!live.length) return null;
    live.sort(function (a, b) {
      var ae = a.end || '9999', be = b.end || '9999';
      if (ae !== be) return ae < be ? -1 : 1;      // nearest deadline first
      return a.pct - b.pct;                         // then least progressed
    });
    return live[0];
  }
  function topTaskOf(c) {
    var pool = ((c && c.tasks) || []).filter(function (t) { return !t.done; });
    if (!pool.length) pool = (data.overdue || []).concat(data.tasks || []).filter(function (t) { return !t.done; });
    if (!pool.length) return null;
    pool.sort(function (a, b) {
      if (!!a.late !== !!b.late) return a.late ? -1 : 1;
      var rank = { high: 0, med: 1, low: 2 };
      return (rank[a.pri] || 1) - (rank[b.pri] || 1);
    });
    return pool[0];
  }

  function evalNudge() {
    var el = document.getElementById('nudge');
    var due = !st.running && idleSince && Date.now() - idleSince > DRIFT_MIN * 60000
      && Date.now() > snoozeUntil;
    var c = due ? topCommitment() : null;
    var t = due ? topTaskOf(c) : null;
    if (!due || (!c && !t)) {
      if (nudged) { nudged = false; nudgeTask = null; el.classList.add('hide'); }
      return;
    }
    nudgeTask = t;
    var mins = Math.floor((Date.now() - idleSince) / 60000);
    document.getElementById('nlabel').textContent = '▲ DRIFTING · ' + mins + 'M NO SESSION';
    document.getElementById('ncommit').textContent = c ? c.title : 'Next up';
    document.getElementById('ntask').textContent = t ? '→ ' + t.title : '';
    el.classList.remove('hide');
    if (!nudged) { nudged = true; chime(); }   // sound once, on the way up
  }

  /* On a timer, not requestAnimationFrame: macOS pauses rAF while the window
     is occluded, which is exactly when the drift check needs to keep running. */
  setInterval(evalNudge, 5000);

  document.getElementById('nudge').addEventListener('click', function () {
    snoozeUntil = Date.now() + SNOOZE_MIN * 60000;
    if (nudgeTask && T && T.event) T.event.emit('tw:cmd', { a: 'open', id: nudgeTask.id });
    nudged = false; document.getElementById('nudge').classList.add('hide');
  });

  var lastStep = -1;
  if (T && T.event) {
    T.event.listen('tw:data', function (e) { data = e.payload || data; render(); });
    T.event.listen('pomo:state', function (e) {
      var q = e.payload || {};
      st.running = !!q.running; st.endTarget = q.endTarget || 0;
      st.totalSecs = q.totalSecs || st.totalSecs;
      st.remainSecs = typeof q.remainSecs === 'number' ? q.remainSecs : st.remainSecs;
      st.dur = q.dur || st.dur; st.title = q.title || '';
      lastStep = Math.floor(prog() * 12 + 1e-9);
      // A running session is the whole point — it resets the drift clock.
      if (st.running) { idleSince = null; nudged = false; document.getElementById('nudge').classList.add('hide'); }
      else if (!idleSince) { idleSince = Date.now(); }
      paintLens();
    });
    T.event.emit('tw:req', {});
    T.event.emit('pomo:req', {});
  }
  paintLens();
  render();

  var acc = 0, last = performance.now();
  (function frame(now) {
    var dt = (now - last) / 1000; last = now;
    var p = prog();
    var step = Math.floor(p * 12 + 1e-9);
    if (st.running && step !== lastStep) {
      if (step >= 12) chime(); else if (step > lastStep) tick();
      lastStep = step;
    }
    document.getElementById('ltime').textContent = fmt(remain());
    // Idle costs ~8fps instead of 60 — this sits on screen all day.
    acc += dt;
    if (st.running || acc > 0.12) { acc = 0; drawLens(p, now / 1000); }
    requestAnimationFrame(frame);
  })(performance.now());
})();
</script>
</body>
</html>
